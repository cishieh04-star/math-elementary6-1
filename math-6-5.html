<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>綠色回收站｜數學 比與比值</title>
<style>
:root{--u:min(4.4vw,2.7vh,23px);--ink:#2b2a33;--ink2:#5b5a66;--sky1:#b9e3ff;--sky2:#eaf8ff;--brick:#d96c4a;--brick2:#b5502f;--y:#ffd54f;--b:#4fa3ff;--r:#ff6b6b;--g:#7bd389;--card:#fff;--line:#e3e6ee;--ok:#2fb86b;--bad:#e5484d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#cfeaff;color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;font-size:var(--u);touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:linear-gradient(#b9e3ff 0%,#eaf8ff 60%,#fff6e0 100%)}
.scr{position:absolute;inset:0;display:none;flex-direction:column;padding:calc(var(--u)*.6) calc(var(--u)*.8) calc(var(--u)*.6)}
.scr.on{display:flex}
.cloud{position:absolute;font-size:calc(var(--u)*3);opacity:.8;animation:drift 40s linear infinite;pointer-events:none}
@keyframes drift{from{transform:translateX(-20vw)}to{transform:translateX(120vw)}}
/* buttons */
.btn{background:#fff;border-radius:calc(var(--u)*1.2);padding:calc(var(--u)*.7) calc(var(--u)*1.1);font-weight:700;box-shadow:0 .25em 0 #c9d3e6;font-size:calc(var(--u)*1.05);min-height:calc(var(--u)*2.9)}
.btn:active{transform:translateY(.15em);box-shadow:0 .1em 0 #c9d3e6}
.btn.y{background:var(--y);box-shadow:0 .25em 0 #d7a91c}
.btn.g{background:var(--g);box-shadow:0 .25em 0 #4fa95f;color:#0b3d1b}
.btn.r{background:#ffb3b3;box-shadow:0 .25em 0 #d98080}
.btn.b{background:#9ccbff;box-shadow:0 .25em 0 #6aa2e0}
.btn.big{font-size:calc(var(--u)*1.5);padding:calc(var(--u)*1)}
.bar{display:flex;gap:calc(var(--u)*.5);align-items:center;flex:none}
.bar .btn{padding:calc(var(--u)*.4) calc(var(--u)*.8);font-size:calc(var(--u)*.95);min-height:calc(var(--u)*2.4);white-space:nowrap}
.bar .sp{flex:1}
.ttl{font-weight:900;font-size:calc(var(--u)*1.3);line-height:1.15}
.sub{font-size:calc(var(--u)*.85);color:var(--ink2)}
/* cover */
#cover{align-items:center;justify-content:center;text-align:center;gap:calc(var(--u)*1.2);background:linear-gradient(#8fd0ff,#eaf8ff 70%,#ffe9b0)}
#cover h1{margin:0;font-size:calc(var(--u)*2.4);line-height:1.15;text-shadow:0 .08em 0 #fff}
#cover .big-city{font-size:calc(var(--u)*5);filter:drop-shadow(0 .1em 0 #fff8)}
/* home */
#home{gap:calc(var(--u)*.4)}
#bldg{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;position:relative}
.roof{flex:none;display:flex;align-items:flex-end;justify-content:center;height:calc(var(--u)*2.4);font-size:calc(var(--u)*2);line-height:1}
.tower{flex:1;min-height:0;width:min(100%,calc(var(--u)*28));display:flex;flex-direction:column;gap:calc(var(--u)*.3);background:linear-gradient(90deg,var(--brick2),var(--brick) 12%,var(--brick) 88%,var(--brick2));padding:calc(var(--u)*.5);border-radius:calc(var(--u)*.6) calc(var(--u)*.6) 0 0;box-shadow:0 0 0 .2em #8f3d22 inset}
.floor{flex:1;min-height:0;display:flex;align-items:center;gap:calc(var(--u)*.6);background:#fff4d6;border-radius:calc(var(--u)*.5);padding:0 calc(var(--u)*.7);text-align:left;box-shadow:0 .18em 0 #c99d5a;position:relative;overflow:hidden}
.floor.done{background:#fff0a8}
.floor.next{animation:pulse 1.4s ease-in-out infinite;outline:.22em solid #fff}
.floor.boss{background:#ffd6e8;box-shadow:0 .18em 0 #d77aa7}
.floor .no{font-weight:900;font-size:calc(var(--u)*1.05);width:calc(var(--u)*2.2);height:calc(var(--u)*2.2);display:grid;place-items:center;background:var(--brick);color:#fff;border-radius:50%;flex:none}
.floor .ic{font-size:calc(var(--u)*1.5);flex:none}
.floor .nm{flex:1;min-width:0;font-weight:800;font-size:calc(var(--u)*1.05);line-height:1.1}
.floor .nm small{display:block;font-weight:500;font-size:calc(var(--u)*.72);color:var(--ink2)}
.floor .st{font-size:calc(var(--u)*.95);letter-spacing:-.1em;flex:none}
.floor:active{transform:translateY(.12em)}
@keyframes pulse{50%{transform:scale(1.02)}}
.ground{flex:none;height:calc(var(--u)*.7);width:100%;background:#7bc36b;border-radius:.3em}
.dock{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--u)*.5)}
.dock .btn{padding:calc(var(--u)*.5) calc(var(--u)*.2);font-size:calc(var(--u)*.92);line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:.1em}
.dock .btn span{font-size:calc(var(--u)*1.5)}
/* level */
.prog{display:flex;gap:calc(var(--u)*.3);flex:1;min-width:0;align-items:center}
.prog i{flex:1;height:calc(var(--u)*.8);border-radius:99px;background:#fff;box-shadow:0 0 0 .12em #c9d3e6 inset}
.prog i.ok{background:var(--ok)}.prog i.bad{background:#ffb347}.prog i.cur{background:var(--y);animation:pulse 1s infinite}
#qwrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:calc(var(--u)*.5);margin-top:calc(var(--u)*.5)}
.card{background:var(--card);border-radius:calc(var(--u)*1);box-shadow:0 .2em 0 #c9d3e6;padding:calc(var(--u)*.7) calc(var(--u)*.9)}
.instr{font-size:calc(var(--u)*.8);color:#fff;background:#4a90e2;border-radius:99px;padding:.15em .8em;align-self:flex-start;font-weight:700}
.stem{font-size:calc(var(--u)*1.35);font-weight:800;line-height:1.35;text-align:center;flex:none}
.stem .num{font-family:"Noto Sans TC",system-ui,sans-serif;color:#d1432d;white-space:nowrap}
.fig{flex:0 1 auto;min-height:0;display:flex;justify-content:center;align-items:center;overflow:hidden}
.fig svg{max-width:100%;max-height:100%}
.fig .tbl{border-collapse:collapse;font-weight:700;font-size:calc(var(--u)*1.05)}
.fig .tbl td,.fig .tbl th{border:.1em solid #9db3d9;padding:.15em .6em;text-align:center;background:#fff}
.fig .tbl th{background:#e4efff}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*.55);flex:none;margin-top:auto}
.opts.one{grid-template-columns:1fr}
.opts.three{grid-template-columns:1fr 1fr 1fr}
.opt{position:relative;border-radius:calc(var(--u)*1);padding:calc(var(--u)*.6) calc(var(--u)*.6);font-weight:800;font-size:calc(var(--u)*1.45);min-height:calc(var(--u)*3.6);box-shadow:0 .22em 0 rgba(0,0,0,.18);color:#1d2b3a;line-height:1.2;transition:transform .12s}
.opt.long{font-size:calc(var(--u)*1.1)}
.opt.c0{background:#ffe27a}.opt.c1{background:#9fd0ff}.opt.c2{background:#ffb1b1}.opt.c3{background:#a8e6b2}
.opt:active{transform:translateY(.15em)}
.opt.hot{outline:.25em solid #fff;transform:scale(1.04);z-index:2}
.opt.off{opacity:.35;pointer-events:none;filter:grayscale(.7)}
.opt.ok{background:var(--ok);color:#fff;animation:pop .5s}
.opt.no{animation:shake .4s}
.opt .nb{position:absolute;left:.35em;top:.25em;width:1.3em;height:1.3em;border-radius:50%;background:#fff9;font-size:.6em;display:grid;place-items:center;font-weight:900}
@keyframes pop{40%{transform:scale(1.12)}}
@keyframes shake{20%{transform:translateX(-.3em)}60%{transform:translateX(.3em)}}
.fb{flex:none;min-height:calc(var(--u)*2.3);text-align:center;font-weight:800;font-size:calc(var(--u)*1.05);color:var(--ink2);display:flex;align-items:center;justify-content:center}
.fb.ok{color:var(--ok)}.fb.bad{color:#c2410c}
/* numpad */
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*.45);flex:none;margin-top:auto}
.pad .k{background:#fff;border-radius:calc(var(--u)*.9);font-weight:900;font-size:calc(var(--u)*1.7);min-height:calc(var(--u)*3.3);box-shadow:0 .2em 0 #b8c4dc}
.pad .k:active{transform:translateY(.15em)}
.pad .k.del{background:#ffd0d0;font-size:calc(var(--u)*1.1)}
.pad .k.go{background:var(--g);font-size:calc(var(--u)*1.2)}
.ansbox{display:flex;justify-content:center;gap:calc(var(--u)*.4);flex-wrap:wrap}
.blank{min-width:calc(var(--u)*4.6);height:calc(var(--u)*2.6);border-radius:calc(var(--u)*.6);background:#fff;border:.15em dashed #8aa;display:grid;place-items:center;font-weight:900;font-size:calc(var(--u)*1.5);padding:0 .4em}
.blank.cur{border-color:#ff9f1c;background:#fff6dc;box-shadow:0 0 0 .2em #ffd66b;animation:pulse 1s infinite}
.blank.fix{background:#e8f9ee;border:.15em solid var(--ok);color:#0b6b36}
.blank.rev{background:#fff1d0;border:.15em solid #ff9f1c}
/* chain */
.chain{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:calc(var(--u)*.3) calc(var(--u)*.2)}
.chain .nd{min-width:calc(var(--u)*3.6);padding:.2em .5em;border-radius:99px;background:#eaf5ff;border:.12em solid #86b4e8;font-weight:800;font-size:calc(var(--u)*1.25);text-align:center}
.chain .ar{color:#6a89b5;font-weight:900}
/* cards */
.slots{display:flex;gap:calc(var(--u)*.4);justify-content:center;flex-wrap:wrap}
.slot{min-width:calc(var(--u)*3);height:calc(var(--u)*3.2);border-radius:calc(var(--u)*.6);background:#fff;border:.15em dashed #8aa;display:grid;place-items:center;font-weight:900;font-size:calc(var(--u)*1.6);padding:0 .3em}
.slot.f{background:#fff3c4;border-style:solid;border-color:#ffb400}
.hand{display:flex;gap:calc(var(--u)*.5);justify-content:center;flex-wrap:wrap;margin-top:auto}
.cardk{min-width:calc(var(--u)*3.6);height:calc(var(--u)*4.2);padding:0 .35em;border-radius:calc(var(--u)*.7);background:linear-gradient(#fff,#f0f6ff);font-weight:900;font-size:calc(var(--u)*1.8);box-shadow:0 .22em 0 #9fb3d6;border:.12em solid #bcd0ee}
.cardk.used{opacity:.25;pointer-events:none}
.cardk.sm{font-size:calc(var(--u)*1.2)}
/* compare */
.cmpbox{display:flex;gap:calc(var(--u)*.8);justify-content:center;align-items:stretch}
.cmpbox .side{flex:1;background:#fff;border-radius:calc(var(--u)*.9);box-shadow:0 .2em 0 #c9d3e6;display:grid;place-items:center;padding:calc(var(--u)*.7);font-weight:900;font-size:calc(var(--u)*1.7);text-align:center;line-height:1.2}
.cmpbox .side.l{background:#e6f1ff}.cmpbox .side.r{background:#ffeadf}
.cmpbox .side small{display:block;font-size:.5em;color:var(--ink2);font-weight:700}
/* board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--u)*.3);width:min(100%,calc(var(--u)*22));margin:0 auto}
.board .h{background:#e3ecff;border-radius:.6em .6em 0 0;text-align:center;font-weight:800;font-size:calc(var(--u)*.95);padding:.15em 0}
.board .d{background:#fff;text-align:center;font-weight:900;font-size:calc(var(--u)*2.4);border-radius:0 0 .6em .6em;border:.1em solid #c8d6f0;padding:.05em 0}
.board .pm{display:flex;justify-content:center}
.board .pm button{width:100%;margin:0;background:#9ccbff;border-radius:.6em;font-weight:900;font-size:calc(var(--u)*1.3);min-height:calc(var(--u)*2.3);box-shadow:0 .15em 0 #6aa2e0}
.read{text-align:center;font-weight:800;color:#c2410c;font-size:calc(var(--u)*1.1);min-height:1.3em}
/* match */
.mt{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*.5) calc(var(--u)*1.2)}
.mt button{background:#fff;border-radius:calc(var(--u)*.8);font-weight:800;font-size:calc(var(--u)*1.15);min-height:calc(var(--u)*3);box-shadow:0 .18em 0 #b8c4dc;padding:.2em .4em}
.mt button.sel{background:#fff3b0;outline:.2em solid #ffb400}
.mt button.done{background:var(--ok);color:#fff;pointer-events:none}
/* overlays */
.ov{position:absolute;inset:0;background:rgba(20,40,80,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:calc(var(--u)*1)}
.ov.on{display:flex}
.panel{background:#fff;border-radius:calc(var(--u)*1.2);padding:calc(var(--u)*1.1);width:min(100%,calc(var(--u)*26));display:flex;flex-direction:column;gap:calc(var(--u)*.6);box-shadow:0 .4em 0 #0003;max-height:100%;overflow:hidden}
.panel h2{margin:0;text-align:center;font-size:calc(var(--u)*1.5)}
.seg{display:flex;gap:calc(var(--u)*.4)}
.seg .btn{flex:1;padding:calc(var(--u)*.4) calc(var(--u)*.2);font-size:calc(var(--u)*.95)}
.seg .btn.sel{background:var(--y);box-shadow:0 .25em 0 #d7a91c}
.row{display:flex;align-items:center;gap:calc(var(--u)*.5);justify-content:space-between;font-weight:700;font-size:calc(var(--u)*1)}
/* teaching class */
#class .stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:calc(var(--u)*.5)}
.blkarea{flex:1;min-height:0;display:flex;flex-wrap:wrap;gap:calc(var(--u)*.4);align-content:center;justify-content:center;overflow:hidden}
.say{font-size:calc(var(--u)*1.25);font-weight:800;text-align:center;min-height:2.6em}
/* group */
.teams{display:grid;gap:calc(var(--u)*.5);flex:none}
.team{border-radius:calc(var(--u)*.8);padding:calc(var(--u)*.4) calc(var(--u)*.6);color:#222;font-weight:800;display:flex;align-items:flex-end;gap:calc(var(--u)*.5);min-height:calc(var(--u)*4)}
.team.cur{outline:.25em solid #fff;box-shadow:0 0 0 .45em #ff9f1c;transform:scale(1.03)}
.team .tw{display:flex;flex-direction:column-reverse;gap:1px;margin-left:auto;height:calc(var(--u)*3.4);justify-content:flex-start;flex-wrap:wrap-reverse;align-content:flex-start;width:50%}
.team .tw i{width:calc(var(--u)*.9);height:calc(var(--u)*.55);background:#fff8;border-radius:2px;box-shadow:0 0 0 1px #0003}
.team b{font-size:calc(var(--u)*1.5)}
/* effects */
.confe{position:fixed;top:-3em;z-index:90;pointer-events:none;font-size:calc(var(--u)*1.8);animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
.toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:95;background:#fff;border-radius:calc(var(--u)*1.2);padding:calc(var(--u)*.8) calc(var(--u)*1.4);font-weight:900;font-size:calc(var(--u)*2);box-shadow:0 .3em 0 #0003;animation:toast 1.4s forwards;pointer-events:none;text-align:center}
@keyframes toast{0%{transform:translate(-50%,-30%) scale(.5);opacity:0}15%{transform:translate(-50%,-50%) scale(1.1);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-70%) scale(1);opacity:0}}
.hide{display:none!important}
/* 名師教室：關鍵字 */
.tkwrap{grid-column:1/-1;display:flex;flex-direction:column;gap:calc(var(--u)*.5);width:100%;height:100%;min-height:0}
.tksay{flex:none;background:#fff;border-radius:.7em;padding:.4em .7em;font-weight:900;font-size:calc(var(--u)*1.15);line-height:1.5;color:#222;box-shadow:0 .12em 0 #c7b99a;text-align:center}
.tkshow{flex:1;min-height:0;overflow:auto}
.tkg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:calc(var(--u)*.4);width:100%}
.tkc{background:#fff;border:.12em solid #0000;border-radius:.6em;padding:.3em .1em;display:flex;flex-direction:column;align-items:center;gap:.1em;box-shadow:0 .15em 0 #c7b99a;color:#222;min-width:0;cursor:pointer;font-family:inherit}
.tkc b{font-size:calc(var(--u)*1.15);line-height:1.2;text-align:center;word-break:break-all}
.tkc small{font-size:calc(var(--u)*.72);font-weight:800;border-radius:99px;padding:0 .5em;color:#fff;white-space:nowrap}
.tk-a small{background:#1864ab}.tk-s small{background:#c92a2a}.tk-t small{background:#2b8a3e}.tk-p small{background:#6741d9}.tk-o small{background:#a8590b}
.tk-a{border-color:#a5d8ff}.tk-s{border-color:#ffc9c9}.tk-t{border-color:#b2f2bb}.tk-p{border-color:#d0bfff}.tk-o{border-color:#ffd8a8}
.tkc.sel{background:#fff3b0;box-shadow:0 0 0 .18em #ffb400}
.tkex{flex:none;display:flex;align-items:center;gap:calc(var(--u)*.6);background:#fff;border-radius:.7em;padding:.35em .7em;box-shadow:0 .12em 0 #c7b99a;min-height:calc(var(--u)*4.2)}
.tkpic{flex:none;max-width:48%;font-size:calc(var(--u)*1.5);font-weight:900;color:#333;display:flex;flex-wrap:wrap;align-items:center;gap:.15em;line-height:1.2}
.tkpic span{display:inline-block;animation:tkpop .45s both}
@keyframes tkpop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:none;opacity:1}}
.tktx{flex:1;font-weight:800;font-size:calc(var(--u)*1.1);line-height:1.5;color:#222}
.tktx mark{background:#ffe066;color:#111;border-radius:.2em;padding:0 .1em}
#clsTabs{display:flex!important;gap:calc(var(--u)*.3)}
#clsTabs .btn{flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden}
@media (max-width:430px){.tkg{grid-template-columns:repeat(3,minmax(0,1fr))}.tkex{flex-direction:column;align-items:flex-start}.tkpic{max-width:100%}}
@media (max-width:430px){.tkc{padding:.18em .05em}.tkc b{font-size:calc(var(--u)*1.0)}.tkc small{font-size:calc(var(--u)*.62)}.tkg{gap:calc(var(--u)*.3)}.tksay{font-size:calc(var(--u)*1.0);padding:.3em .5em}.tkex{min-height:0;padding:.25em .6em}.tkpic{font-size:calc(var(--u)*1.2)}.tktx{font-size:calc(var(--u)*.95)}}

/* landscape */
@media (min-aspect-ratio:13/10){
 :root{--u:min(2.2vw,3.4vh)}
 #qwrap.land{display:grid;grid-template-columns:1.1fr 1fr;grid-template-rows:auto auto 1fr auto;column-gap:calc(var(--u)*1);row-gap:calc(var(--u)*.4)}
 #qwrap.land .opts,#qwrap.land .pad,#qwrap.land .hand{grid-column:2;grid-row:1/-1;margin-top:0;align-self:center}
 #qwrap.land>:not(.opts):not(.pad):not(.hand):not(.bdbox){grid-column:1}
 #qwrap.land>.instr{grid-row:1}
 #qwrap.land>.fb{min-height:0}
}
@media (min-aspect-ratio:13/10){
 .tower{display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;grid-template-rows:repeat(5,1fr)}
 .dock .btn span{font-size:calc(var(--u)*1.2)}
}

.instr.ghost{display:none}
@media (min-aspect-ratio:13/10){.instr.ghost{display:block;height:0;padding:0;margin:0;overflow:hidden;visibility:hidden}}

/* ===== extra ===== */
.vbtn{white-space:nowrap}
.row2{display:flex;align-items:center;gap:calc(var(--u)*.6);flex:none;margin-top:calc(var(--u)*.4)}
.hud{font-weight:900;font-size:calc(var(--u)*1.1);white-space:nowrap;flex:none}
.hud .bump{display:inline-block;animation:bump .5s}
.hud .hp{letter-spacing:-.05em;font-size:calc(var(--u)*.95)}
@keyframes bump{40%{transform:scale(1.5)}}
.intro{margin:auto;text-align:center;display:flex;flex-direction:column;gap:calc(var(--u)*.6);padding:calc(var(--u)*2) calc(var(--u)*1.5);width:min(100%,calc(var(--u)*24));animation:pop .6s}
.bigic{font-size:calc(var(--u)*5);line-height:1}
.bigic.sad{filter:grayscale(.4)}
.floor.lock{opacity:.55;filter:grayscale(.6)}
#cover .hint{font-weight:900;font-size:calc(var(--u)*1.6);background:#fff;border-radius:99px;padding:.4em 1.4em;box-shadow:0 .2em 0 #c9d3e6;animation:pulse 1.4s infinite}
#cover .vb{position:absolute;top:calc(var(--u)*.6);right:calc(var(--u)*.8)}
#result{align-items:center;gap:calc(var(--u)*.7)}
#result .bar{align-self:stretch}
#rbody{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*.6);text-align:center;width:min(100%,calc(var(--u)*28))}
#rbody .ttl{font-size:calc(var(--u)*1.9)}
.rsub{font-weight:700;font-size:calc(var(--u)*1.15);color:var(--ink2);line-height:1.4}

<script>

'use strict';
/* ================= 基本工具 ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const uniq=a=>[...new Set(a)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function seedRand(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function withSeed(seed,fn){const old=Math.random;Math.random=seedRand(seed);try{return fn()}finally{Math.random=old}}

/* ===== 數字讀法（國語）===== */
const DG=['零','一','二','三','四','五','六','七','八','九'];
function zh(n){n=+n;if(n>=10000&&n<100000){const w=Math.floor(n/10000),r=n%10000;return zh(w)+'萬'+(r?(r<1000?'零':'')+zh(r):'')}if(n===0)return '零';if(n<10)return DG[n];if(n<20)return '十'+(n%10?DG[n%10]:'');
  const th=Math.floor(n/1000)%10,h=Math.floor(n/100)%10,t=Math.floor(n/10)%10,u=n%10;let s='';if(th)s+=(th===2?'兩':DG[th])+'千';if(h)s+=(h===2&&!th?'兩':DG[h])+'百';else if(th&&(t||u))s+='零';
  if(t)s+=DG[t]+'十';else if(u&&(th||h)&&!s.endsWith('零'))s+='零';if(u)s+=DG[u];return s}
/* 把畫面上的文字，換成語音要唸的樣子（含破音字處理） */
function spoken(s){
  s=String(s==null?'':s).replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ');
  s=s.replace(/[\[\]]/g,'').replace(/☆/g,'星星').replace(/♥/g,'愛心').replace(/\*/g,'').replace(/\{([A-Z])([A-Z])\}/g,'$1到$2這一段').replace(/\{([^}]+)\}/g,'$1');
  // 破音字：量（ㄌㄧㄤˊ，量長度）、數（ㄕㄨˇ，數一數）
  s=s.replace(/(數|重|容|份|力|測|水|用|液|食|飯|酒|雨|油|糖|熱|含)?量(販)?/g,(m,p,q)=>q?m:p?(p==='測'?'測梁':m):'梁');
  s=s.replace(/(校|班|家|組|隊|市|縣|部|院|局|社|首|成|生|里|站|店|園|鄉|鎮|村)長|長(大|輩|官|老|子)/g,m=>m.replace('長','掌')).replace(/長/g,'常');
  s=s.replace(/[\p{Extended_Pictographic}\uFE0F\u200D]/gu,'').replace(/一(個|隻|條|格|片|張|塊|圈|顆)一\1數/g,'一$1一$1鼠').replace(/(\d+)(個|條|顆|元|張)(、?)\1\2數/g,'$1$2$3$1$2鼠').replace(/數(錯|漏|起|清|完|好)/g,'鼠$1').replace(/怎麼數/g,'怎麼鼠').replace(/(來|往上|往下|一起|慢慢)數/g,'$1鼠').replace(/唱數/g,'唱鼠').replace(/(個一|個十|5個一|10個一)數/g,'$1鼠').replace(/(\d)\s*mL/g,'$1毫升').replace(/(\d)\s*L(?![a-zA-Z])/g,'$1公升').replace(/被/g,'背').replace(/當作/g,'噹作').replace(/當單位/g,'噹單位').replace(/(?<!一(格|片|張|個)一)(格|片|張|個)數(?!一)/g,'$2樹');s=s.replace(/露出/g,'漏出').replace(/重疊/g,'蟲疊').replace(/空隙/g,'控隙').replace(/(還|只|就)差/g,'$1岔').replace(/扠/g,'眨').replace(/釘入/g,'定入').replace(/釘進/g,'定進').replace(/釘在/g,'定在');
  s=s.replace(/數一數/g,'鼠一鼠').replace(/數數看/g,'鼠鼠看').replace(/數格子/g,'鼠格子').replace(/數出/g,'鼠出').replace(/數到/g,'鼠到').replace(/來數/g,'來鼠').replace(/再數/g,'再鼠').replace(/數一下/g,'鼠一下').replace(/一格一格數/g,'一格一格鼠');
  s=s.replace(/重疊/g,'疊在一起');
  s=s.replace(/公分[（(]cm[）)]/g,'公分').replace(/≈/g,'大約').replace(/∠/g,'角').replace(/°/g,'度').replace(/cm²/g,'平方公分').replace(/cm/g,'公分');
  s=s.replace(/×/g,'乘以').replace(/÷/g,'除以').replace(/[＋+]/g,'加').replace(/[－−]/g,'減').replace(/[＝=]/g,'等於').replace(/＞/g,'大於').replace(/＜/g,'小於');
  s=s.replace(/[（(][\s　]*[）)]/g,'空格').replace(/□/g,'空格').replace(/？(?=\s*(公分|度|條|格|平方))/g,'多少');
  s=s.replace(/(^|[^\d第.])2(?=(條|個|塊|格|段|種|次|倍|邊|張|片|隻|半|組|排|行|隊|題|層|步|本|顆|元|朵|頁|輛|歲|枝|支|瓶|盒|包|位|根|把|罐|雙|扠|大格|樣|公升|L|杯|週|堆|袋|人|公分|公斤|公尺|段|打|瓶))/g,'$1兩');
  s=s.replace(/(\d+)\s*〔([^〔〕\/]*)\/([^〔〕]*)〕/g,(m,w,x,y)=>w+'又'+(y.trim()||'空格')+'分之'+(x.trim()||'空格')).replace(/〔([^〔〕\/]*)\/([^〔〕]*)〕/g,(m,x,y)=>(y.trim()||'空格')+'分之'+(x.trim()||'空格'));
  s=s.replace(/(\d)\s*°/g,'$1度').replace(/°/g,'度').replace(/∠/g,'角').replace(/[★☆]/g,'星星').replace(/△/g,'三角形').replace(/重疊/g,'蟲疊').replace(/(\d)\s*cm/g,'$1公分').replace(/([？！?!])\s*[。．]/g,'$1').replace(/內角和/g,'內角合').replace(/和差積商/g,'合差積商').replace(/和不變/g,'合不變').replace(/米行/g,'米航').replace(/(要|都|不|來|再|樹|旁|在|一側|兩側|可以)種(?![類])/g,'$1眾').replace(/種(樹|植|一|花|菜|了|幾|在|上)/g,'眾$1').replace(/([的之])和/g,'$1合').replace(/扇形/g,'善形').replace(/扇子/g,'善子').replace(/量角器/g,'梁角器').replace(/⌒/g,'');
  s=s.replace(/假分數/g,'甲分數').replace(/(?<![適恰相妥])當(?=作|做|成|分子|分母|一份|單位|共同)/g,'噹');
  s=s.replace(/重複/g,'蟲複').replace(/重新/g,'蟲新').replace(/奇數/g,'機數').replace(/([0-9一二兩三四五六七八九十幾每]|張一)行/g,'$1航').replace(/[～~]/g,'到').replace(/(\d+(?:個|顆|張|根|片|粒|隻|人)?)一數/g,'$1一鼠').replace(/水果行/g,'水果航').replace(/●/g,'黑點').replace(/(\d)\s*…\s*(\d)/g,'$1餘$2').replace(/(\d)\s*…\s*(?=空格)/g,'$1餘').replace(/空格…/g,'空格餘').replace(/…+/g,'，');
  s=s.replace(/([\d)）□■●▲★格甲乙丙])\s*：\s*(?=[\d(（□■●▲★空〔甲乙丙])/g,'$1比');
  s=s.replace(/茶行/g,'茶航').replace(/車行(?!駛)/g,'車航');
  s=s.replace(/(概|小|整|位|分|倍|次|人|格|片|讀|個|因|除|偶|奇|公|某|甲|乙|丙|這|餘|樹)鼠/g,'$1數');
  s=s.replace(/(\d+)\.(\d+)/g,(m,a,b)=>zh(+a)+'點'+b.split('').map(c=>DG[+c]).join(''));
  s=s.replace(/\d+/g,m=>{const n=+m;return n<100000?zh(n):m.split('').map(c=>DG[+c]).join('')});
  s=s.replace(/([A-Z])(?=[A-Z])/g,'$1 ');
  s=s.replace(/[（）()]/g,'，').replace(/\n/g,'，').replace(/→/g,'，').replace(/[✔✓✕✗✘○]/g,'').replace(/\s+/g,' ');
  return s;
}

/* ===== 排程（可暫停）===== */
const CLK={paused:false,pend:[],timers:new Set()};
function later(fn,ms){
  const t=setTimeout(()=>{CLK.timers.delete(t);if(CLK.paused)CLK.pend.push(fn);else fn()},ms);
  CLK.timers.add(t);return t;
}
function clearLater(){CLK.timers.forEach(clearTimeout);CLK.timers.clear();CLK.pend=[]}
function animPause(p){try{document.getAnimations().forEach(a=>{if(p){if(a.playState==='running')a.pause()}else if(a.playState==='paused')a.play()})}catch(e){}}
function setPaused(p){
  CLK.paused=p;animPause(p);
  if(p){TTS.stop()}
  else{const q=CLK.pend;CLK.pend=[];q.forEach(f=>f())}
}
let _lastTap=0;
function guard(ms){const n=Date.now();if(n-_lastTap<ms)return false;_lastTap=n;return true}

/* ===== 設定 / 狀態 ===== */
const S={voice:true,rate:0.6,count:6,sfx:true,done:{},stars:{},instrSeen:{},unlockAll:true,lesSeen:{}};
let _store=null;try{_store=window.localStorage}catch(e){}
try{const r=_store&&+_store.getItem('m65-rate');if(r>=0.4&&r<=1)S.rate=r}catch(e){}
const dayKey=()=>{const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()};
function dailyDone(){try{return _store&&_store.getItem('m65-daily-v1')==String(dayKey())}catch(e){return false}}
function setDailyDone(){try{_store&&_store.setItem('m65-daily-v1',String(dayKey()))}catch(e){}}

/* ===== 語音 ===== */
function gapMul(){return Math.max(.35,Math.min(1.7,0.6/(S.rate||0.6)))}
const TTS={saf:/Safari/.test(navigator.userAgent)&&!/Chrome|Chromium|CriOS|Edg|Android/.test(navigator.userAgent),needVo:false,ok:'speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined',gen:0,mult:1,vo:null,
  stop(){this.gen++;this.seq++;try{this.ok&&speechSynthesis.cancel()}catch(e){}},
  est(t){return Math.max(500,String(t).length*(S.rate<0.7?330:S.rate<0.9?270:210))/(TTS.mult||1)},
  pickVoice(){try{const vs=speechSynthesis.getVoices();this.vo=vs.find(v=>/zh[-_]TW/i.test(v.lang)&&v.localService)||vs.find(v=>/zh[-_]TW/i.test(v.lang))||vs.find(v=>/zh[-_]Hant/i.test(v.lang))||null}catch(e){}},
  seq:0,
  one(text,gen,done){
    /* Safari 的 rate 常常只在第一句有效：把句子在標點處切小段，段和段之間依速度停頓，讓「慢一點／快一點」一定聽得出來 */
    if(!this.saf)return this.one1(text,gen,done);
    const my=++this.seq,parts=String(text).split(/(?<=[，、。：；？！,;:?!])/).map(x=>x.trim()).filter(x=>/[\p{L}\p{N}]/u.test(x));
    if(parts.length<2&&S.rate>=0.75)return this.one1(text,gen,done);
    const pause=Math.max(40,Math.round(150+1100*(0.8-S.rate)));let k=0;
    const step=()=>{if(my!==TTS.seq||gen!==TTS.gen||SP.paused){done&&done();return}
      if(k>=parts.length){done&&done();return}
      const p=parts[k++];TTS.one1(p,gen,()=>{if(k>=parts.length||my!==TTS.seq||gen!==TTS.gen||SP.paused){step();return}setTimeout(step,pause)})};
    step()},
  one1(text,gen,done){
    if(gen!==this.gen) return;
    let fin=false;const f=()=>{if(fin)return;fin=true;clearTimeout(tm);done&&done()};
    const tm=setTimeout(f,this.est(text)*1.7+900);
    try{
      const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';if(this.vo&&!(TTS.saf&&!TTS.needVo))u.voice=this.vo;u.rate=S.rate*(TTS.mult||1);u.pitch=1.05;
      let st0=false;u.onstart=()=>{st0=true};u.onend=f;u.onerror=f;try{speechSynthesis.resume()}catch(e){}speechSynthesis.speak(u);
      setTimeout(()=>{if(!st0&&!fin&&gen===TTS.gen){if(TTS.saf)TTS.needVo=true;clearTimeout(tm);setTimeout(f,Math.max(400,TTS.est(text)*0.8))}},2200);
    }catch(e){clearTimeout(tm);setTimeout(f,this.est(text))}
  }
};
if(TTS.ok){TTS.pickVoice();try{speechSynthesis.onvoiceschanged=()=>TTS.pickVoice()}catch(e){}}

/* ===== 說話：可以暫停、可以調速度 ===== */
const SPD=Array.from({length:13},(_,i)=>Math.round((0.4+i*0.05)*100)/100).concat([1.1,1.2,1.3,1.4,1.5,1.6,1.8]);
const spdName=v=>v<0.55?'很慢':v<0.75?'慢':v<0.9?'普通':v<1.15?'快':v<1.45?'很快':'超快';
const SP={paused:false,cur:null};
// items: [string | {t,on,gap}]；依序唸出，每段開始前呼叫 on
function speakSeq(items,onAll,gap){
  TTS.stop();const gen=TTS.gen;gap=gap==null?300:gap;
  const st={items,i:0,onAll,gap,gen,called:-1,waiting:false,ep:0};SP.cur=st;spSync();
  const next=()=>{
    if(gen!==TTS.gen)return;
    if(SP.paused){st.waiting=true;return}
    if(st.i>=items.length){if(SP.cur===st){SP.cur=null;spSync()}onAll&&onAll();return}
    const it=items[st.i],t=typeof it==='string'?it:it.t,on=typeof it==='string'?null:it.on,g=(typeof it!=='string'&&it&&it.gap!=null)?it.gap:gap;
    if(st.called<st.i){st.called=st.i;try{on&&on()}catch(e){console.error(e)}}
    const txt=spoken(t||''),ep=st.ep;
    const done=()=>{if(gen!==TTS.gen||ep!==st.ep)return;if(SP.paused){st.waiting=true;return}st.i++;later(()=>{if(gen===TTS.gen&&ep===st.ep)next()},g*gapMul())};
    if(!S.voice||!TTS.ok||!txt.trim()){later(done,txt.trim()?(S.voice?TTS.est(txt)*0.5:Math.max(500,TTS.est(txt)*0.45)):150);return}
    TTS.one(txt,gen,done);
  };
  st.next=next;if(CLK.paused&&!SP.frz){CLK.pend.push(()=>{if(gen===TTS.gen)next()});return}next();
}
function say(t,cb){speakSeq([t],cb)}
function spIdx(){let k=0,d=9;SPD.forEach((x,i)=>{const dd=Math.abs(x-S.rate);if(dd<d){d=dd;k=i}});return k}
function spHush(){TTS.seq++;try{if(TTS.ok){speechSynthesis.pause();speechSynthesis.cancel()}}catch(e){}}
function spPause(btn){const c=SP.cur;SP.paused=true;animPause(true);SP.btn=btn||null;document.body.classList.add('sp-paused');if(!CLK.paused){CLK.paused=true;SP.frz=true}spHush();clearInterval(SP.iv);

function tone(f,t0,d,type,vol,slide){
  const c=ac();if(!c||!S.sfx)return;
  const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,c.currentTime+t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,c.currentTime+t0+d);
  g.gain.setValueAtTime(0.0001,c.currentTime+t0);g.gain.exponentialRampToValueAtTime(vol||0.15,c.currentTime+t0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+t0+d);
  o.connect(g);g.connect(c.destination);o.start(c.currentTime+t0);o.stop(c.currentTime+t0+d+0.05);
}
function noise(t0,d,vol,hp){
  const c=ac();if(!c||!S.sfx)return;
  const b=c.createBuffer(1,c.sampleRate*d,c.sampleRate),da=b.getChannelData(0);for(let i=0;i<da.length;i++)da[i]=(Math.random()*2-1)*(1-i/da.length);
  const s=c.createBufferSource();s.buffer=b;const g=c.createGain();g.gain.value=vol||0.2;const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=hp||800;
  s.connect(f);f.connect(g);g.connect(c.destination);s.start(c.currentTime+t0);
}

  const box=document.createElement('div');box.className='opts '+(mid?'one':n===3&&!hasH?'three':'')+(hasH?' pics':'');
  opts.forEach((o,i)=>{const b=document.createElement('button');b.className='opt c'+(i%4)+(long?' long':'')+(o.html?' pic':'');b.dataset.i=i;
    b.innerHTML=(q.type==='tf'?'':`<span class="nb">${NB[i]||i+1}</span>`)+(o.html?o.html+(o.cap?`<span class="cap">${tokH(o.cap)}</span>`:''):tokH(o.t));box.appendChild(b)});
  host.appendChild(box);fbEl(host);

      else ctx.hint(q)}

  const refresh=()=>{blanks.forEach((b,i)=>{if(i===cur&&!done){b.classList.add('cur');b.textContent=buf||'？'}})};
  const advance=()=>{cur++;buf='';tries=0;blanks.forEach((b,i)=>{if(i!==cur)b.classList.remove('cur')});
    if(cur>=blanks.length){done=true;ctx.finish(!anyBad,q,anyBad)}else refresh()};
  const press=k=>{
    if(done||ctx.dead())return;
    if(k==='del'){buf=buf.slice(0,-1);SFX.tap();refresh();return}
    if(k==='go'){if(!buf)return;if(!guard(300))return;TTS.stop();
      if(buf===ans[cur]||(q.numEq&&/^[0-9.]+$/.test(buf)&&!isNaN(parseFloat(buf))&&Math.abs(parseFloat(buf)-parseFloat(ans[cur]))<1e-9)){const b=blanks[cur];b.classList.remove('cur');b.classList.add('fix');b.textContent=buf;SFX.ok();advance()}
      else{tries++;anyBad=true;SFX.bad();const b=blanks[cur];b.style.animation='shake .4s';setTimeout(()=>b.style.animation='',420);buf='';b.textContent='？';
        if(tries>=ctx.maxTries){b.classList.remove('cur');b.classList.add('rev');b.textContent=ans[cur];advance()}else ctx.hint(q)}
      return}
    if(buf.length>=8)return;if(k==='.'&&(buf.includes('.')||!buf))return;buf+=k;SFX.tap();refresh();
  };
  $$('.k',pad).forEach(b=>b.onclick=()=>press(b.dataset.k));refresh();
  ctx.auto=()=>{if(done)return;buf=ans[cur];_lastTap=0;press('go')};
  ctx.autoWrong=()=>{if(done)return false;buf=ans[cur]==='9'?'8':'9'+ans[cur];_lastTap=0;press('go');return true};
  ctx.speakTail=[];ctx.speakEnd=()=>{};
}

    else{bad++;SFX.bad();b.style.animation='shake .4s';setTimeout(()=>b.style.animation='',420);
      if(bad>=3){locked=true;lb.forEach(l=>{const r=rb.find(x=>x.dataset.i===l.dataset.i);l.classList.add('done');r.classList.add('done')});ctx.finish(false,q,true)}else ctx.hint(q)}
  };
  lb.forEach(b=>b.onclick=()=>clickL(b));rb.forEach(b=>b.onclick=()=>clickR(b));
  ctx.auto=()=>{lb.forEach(l=>{if(l.classList.contains('done'))return;_lastTap=0;clickL(l);const r=rb.find(x=>x.dataset.i===l.dataset.i);_lastTap=0;clickR(r)})};
  ctx.autoWrong=()=>{if(locked)return false;const l=lb.find(x=>!x.classList.contains('done'));const r=rb.find(x=>x.dataset.i!==l.dataset.i&&!x.classList.contains('done'));if(!r)return false;_lastTap=0;clickL(l);_lastTap=0;clickR(r);return true};
  ctx.speakTail=[];ctx.speakEnd=()=>{};
}

const QM={ctx:null,qs:[],idx:0,res:[],cfg:null,host:null,gen:0};
function qmStart(qs,cfg){QM.qs=qs;QM.idx=0;QM.res=[];QM.cfg=cfg;QM.host=cfg.host;QM.gen++;QM.pendingAdv=null;clearLater();TTS.stop();qmShow()}
const qmDead=gen=>gen!==QM.gen;

function qmProg(){const p=QM.cfg.prog;if(!p)return;p.innerHTML=QM.qs.map((_,i)=>`<i class="${i<QM.res.length?(QM.res[i]?'ok':'bad'):i===QM.idx?'cur':''}"></i>`).join('')}
function qmShow(){
  setNextBtn(false);
  const gen=QM.gen,q=QM.qs[QM.idx];
  if(!q){QM.cfg.onEnd&&QM.cfg.onEnd(QM.res.slice());return}
  const host=QM.host;qmProg();QM.cfg.onShow&&QM.cfg.onShow(QM.idx,q);
  const ctx={maxTries:QM.cfg.maxTries||2,locked:false,dead:()=>qmDead(gen)||CLK.paused,
    hint(q){const h=q.hint||'再想一想，再試一次。';setFb(host,h,'bad');speakSeq([h])},
    finish(first,q,revealed){
      if(qmDead(gen))return;QM.res.push(first);qmProg();
      const msg=first?pick(['答對了！','太棒了！','沒錯！','你做到了！','答案正確！']):(revealed?'看，答案是這樣：':'答對了！');
      setFb(host,(first||!revealed?msg+' ':'')+(q.why||''),first||!revealed?'ok':'bad');
      if(first||!revealed){SFX.ok();confetti(first?14:6)}
      q.afterOk&&q.afterOk(host);
      QM.cfg.onAnswer&&QM.cfg.onAnswer(first,q,!!revealed);
      const adv=()=>{if(qmDead(gen)||QM.pendingAdv!==adv)return;QM.pendingAdv=null;closeTeach();QM.idx++;qmShow()};
      QM.pendingAdv=adv;setNextBtn(true);
      if(revealed&&q.teach&&QM.cfg.maxTries>1){later(()=>{if(QM.pendingAdv===adv)openTeach(q,adv)},900);return}
      const w=q.whySay||q.why;
      if(w){speakSeq([(first?'':'')+w],()=>later(adv,first?900:1500))}
      else{TTS.stop();later(adv,first?1250:1700)}
    }};
  QM.ctx=ctx;
  (REND[q.type]||rMC)(q,host,ctx);
  ctx.replay=()=>{if(CLK.paused||QM.pendingAdv||$('#ovTeach').classList.contains('on'))return;speakSeq((ctx.speakHead||[]).concat(ctx.speakTail||[]),ctx.speakEnd)};
  later(()=>{if(!qmDead(gen))ctx.replay()},300);
}

function openTeach(q,adv){

  ov.innerHTML=`<div class="panel tpanel"><div class="tq"><span class="tqt">題目</span>${stemHtml(q.stem)}</div><div class="tfig"></div><div class="tsay" id="tSay"></div><div class="teq" id="tEq"></div><div class="tbtns"><div class="clsbar2"></div><button class="btn y" id="tAgain">再看一次</button><button class="btn g" id="tBack">${adv?'下一題 ▶':'回到題目'}</button></div></div>`;
  ov.classList.add('on');
  const eq=h=>eqLog($('#tEq'),h);
  const run=()=>{
    $('.tfig',ov).innerHTML=Tq.fig;$('#tEq').innerHTML='';$('#tBack').classList.remove('pulse');
    const root=$('.tfig',ov);
    const items=Tq.items(root,eq).flat(4).map(it=>typeof it==='string'?{t:it}:it).map(it=>({t:it.t,gap:it.gap==null?900:it.gap,on:()=>{if(tok!==TCH.tok)return;if(it.t&&it.t.length>2)$('#tSay').innerHTML=tokH(it.t);it.on&&it.on(root,eq)}}));
    speakSeq([{t:'我們一起來想一想。',on:()=>{$('#tSay').textContent='我們一起來想一想。'}}].concat(items),()=>{if(tok===TCH.tok){const b=$('#tBack');b&&b.classList.add('pulse');$('#tSay').textContent=adv?'看懂了嗎？按「下一題」繼續。':'看懂了嗎？按「回到題目」，換你試試看。'}},1000);

function F_shadow(){const [h,s]=pick([[160,120],[150,45],[180,120],[110,60],[150,60],[180,125]]),k=pick([2,3,4]),askH=Math.random()<.5,H=h*k,S=s*k;const fig=shadowFig(h,s,askH?null:H,askH?S:null,{l1:'人',l2:'樹'});

/* n可以被哪一個數整除（從考卷的選項裡挑） */
const XDV=(n,C)=>()=>{const ok=C.filter(x=>n%x===0&&x>1&&x<n),no=C.filter(x=>n%x);let NO=no.slice();for(let x=3;NO.length<3;x++)if(n%x&&!NO.includes(x))NO.push(x);const d=pick(ok),t=teachDiv(n,d,{big:n>48});
  return TQ(MP(`${n}可以被下面哪一個數整除？`,[d,...shuffle(NO).slice(0,3)].map(String),0,{why:`${n}÷${d}＝${n/d}，餘數是0。`,hint:'一個一個除除看。'}),t.fig,t.items)};
const XNDV=(n,C)=>()=>{const ok=C.filter(x=>n%x===0),no=C.filter(x=>n%x);const d=pick(no),t=teachDiv(n,d,{big:n>48});
  return TQ(MP(`下面哪一個數「不能」整除${n}？`,[d,...shuffle(ok).slice(0,3)].map(String),0,{why:`${n}÷${d}＝${Math.floor(n/d)}…${n%d}，有餘數。`,hint:'一個一個除除看。'}),t.fig,t.items)};
const XFA=(n,C)=>()=>{let F=C.filter(x=>n%x===0&&x>1&&x<n);if(!F.length)F=[1,n];const NF=C.filter(x=>n%x);let W=NF.slice();for(let x=3;W.length<3;x++)if(n%x&&!W.includes(x))W.push(x);const t=teachFac(n);
  return TQ(MP(`把${n}的因數圈起來：下面哪一個是${n}的因數？`,[pick(F),...shuffle(W).slice(0,3)].map(String),0,{why:`${n}的因數有${LJ(facs(n))}。`,hint:`能整除${n}的就是因數。`}),t.fig,t.items)};
const XCF=(a,b,C,u)=>()=>{u=u||'';const cf=cfs(a,b),ok=C.filter(x=>cf.includes(x)&&x>1),no=C.filter(x=>!cf.includes(x));const L=pick(ok.length?ok:[1]);const t=teachCommon([a,b],{gcd:false});
  return TQ(MP(`下面哪一個是${a}和${b}的公因數？`,[L,...shuffle(no).slice(0,3)].map(x=>x+u),0,{why:`${a}和${b}的公因數有${LJ(cf)}。`,hint:'要同時整除兩個數。'}),t.fig,t.items)};
/* 哪一個算式可以整除／不能整除 */
const XDQ=(E,want)=>()=>{const P=E.map(e=>e.split('÷').map(Number)),ok=P.filter(p=>p[0]%p[1]===0),no=P.filter(p=>p[0]%p[1]);const A=want?ok:no,B=(want?no:ok).slice();if(!A.length)return null;for(let g=0;B.length<3&&g<50;g++){const d=rnd(3,9),q=rnd(4,30),n=d*q+(want?rnd(1,d-1):0);if(!B.some(p=>p[0]===n&&p[1]===d))B.push([n,d])}const c=pick(A),t=teachDiv(c[0],c[1],{big:c[0]>48});
  return TQ(MP(`下面哪一個算式${want?'可以':'「不能」'}整除？`,[c,...shuffle(B).slice(0,3)].map(p=>`${p[0]}÷${p[1]}`),0,{why:`${c[0]}÷${c[1]}＝${Math.floor(c[0]/c[1])}…${c[0]%c[1]}。`,hint:'算算看，餘數是0的就是整除。'}),t.fig,t.items)};

function qKey(q){return q.stem+'|'+JSON.stringify([q.ans,q.blanks,q.opts&&q.opts.map(o=>o.t||o.say||o)])}
function tryMake(fn,seen){for(let t=0;t<16;t++){try{const q=fn();if(!q)continue;const k=qKey(q);if(seen&&seen.has(k))continue;seen&&seen.add(k);return q}catch(e){(window.__qerr=window.__qerr||[]).push(String(e&&e.stack||e))}}return null}
function buildQs(lv,n,seen){n=n||S.count;seen=seen||new Set();const a=Math.round(n/3),b=Math.round(n/3),cnt=[a,b,Math.max(1,n-a-b)],out=[];
  [1,2,3].forEach((t,ti)=>{let pool=shuffle(lv.mk.filter(x=>x[0]===t).map(x=>x[1]));if(lv.first&&t===1)pool=[lv.first].concat(pool.filter(f=>f!==lv.first));for(let i=0;i<cnt[ti];i++){const q=tryMake(pool[i%pool.length],seen);if(q){q.lvlTier=t;out.push(q)}}});return out}
function buildBoss(n,seen){n=n||8;seen=seen||new Set();const out=[];const ls=shuffle(LV.slice(0,6)).concat(shuffle(LV.slice(1,6)));

  st.innerHTML=`<div class="tkwrap"><div class="tksay" id="tkSay">點一個關鍵字，聽聽它的意思。</div><div class="tkshow"><div class="tkg">${TKW.map((x,i)=>`<button class="tkc tk-${x.c}" data-i="${i}"><b>${esc(x.k)}</b><small>${esc(x.g)}</small></button>`).join('')}</div></div><div class="tkex"><div class="tkpic" id="tkPic">👆</div><div class="tktx" id="tkTx">題目裡的關鍵字，會告訴我們要怎麼想。</div></div><div class="clsbar2"></div></div>`;
  $$('.tkc',st).forEach(b=>b.onclick=()=>{if(!guard(300))return;const x=TKW[+b.dataset.i];$$('.tkc',st).forEach(y=>y.classList.toggle('sel',y===b));SFX.tap();
    $('#tkSay').innerHTML=tokH(x.m);$('#tkPic').innerHTML=`<span>${FRH(esc(x.p()))}</span>`;$('#tkTx').innerHTML='例：'+tokH(x.e).split(esc(x.k)).join(`<mark>${esc(x.k)}</mark>`);speakSeq([x.m,'例如：'+x.e])});
  speakSeq(['關鍵字。點一個關鍵字，聽聽看它的意思。']);
}
/* 圖太大時自動縮小 */
function fitSwaps(){document.querySelectorAll('.swap').forEach(sw=>{const c=sw.firstElementChild;if(!c||c.tagName.toLowerCase()==='svg'||c.matches('.vw,.vq'))return;
  c.style.transform='';const H=sw.clientHeight,W=sw.clientWidth;if(!H||!W)return;const s=Math.min(1,H/c.scrollHeight,W/c.scrollWidth);if(s<1){c.style.transform=`scale(${(s*.96).toFixed(3)})`;c.style.transformOrigin='center center'}})}
(function(){let q=0;const go=()=>{if(!q)q=requestAnimationFrame(()=>{q=0;fitSwaps()})};try{new MutationObserver(go).observe(document.getElementById('app'),{childList:true,subtree:true})}catch(e){}window.addEventListener('resize',go)})();

/* ---------- 設定 / 暫停 ---------- */
function speedSeg(){const k=spIdx();return `<div class="seg" id="spSeg">${[0,4,8,12,15,19].map(i=>`<button class="btn ${Math.abs(S.rate-SPD[i])<.01?'sel':''}" data-v="${SPD[i]}">${spdName(SPD[i])}${i===0?'':' '+(i+1)}</button>`).join('')}</div>`}
function bindSpeed(){$$('#spSeg .btn').forEach(b=>b.onclick=()=>{spSet(SPD.findIndex(v=>Math.abs(v-+b.dataset.v)<.01))})}
function openSettings(){
  $('#setBody').innerHTML=`<h2>⚙ 設定</h2><div class="row"><span>聲音</span><button class="btn vbtn"></button></div><div class="row"><span>說話速度</span></div>${speedSeg()}
   <div class="row"><span>每一層幾題？</span></div><div class="seg" id="cntSeg">${[4,6,8].map(n=>`<button class="btn ${S.count===n?'sel':''}" data-v="${n}">${n}題</button>`).join('')}</div>
   <div class="row"><span>樓層鎖（老師用）</span></div><div class="seg" id="lockSeg"><button class="btn ${!S.unlockAll?'sel':''}" data-v="0">一層一層</button><button class="btn ${S.unlockAll?'sel':''}" data-v="1">全部打開</button></div>
   <div class="row"><span>點數（老師用）</span><button class="btn r" id="ptReset">點數歸零</button></div>
   <button class="btn g big" id="setOk">好了</button>`;
  syncVoice();bindSpeed();$$('#setBody .vbtn').forEach(b=>b.onclick=toggleVoice);
  $$('#cntSeg .btn').forEach(b=>b.onclick=()=>{S.count=+b.dataset.v;$$('#cntSeg .btn').forEach(x=>x.classList.toggle('sel',x===b));SFX.tap()});
  $$('#lockSeg .btn').forEach(b=>b.onclick=()=>{S.unlockAll=b.dataset.v==='1';$$('#lockSeg .btn').forEach(x=>x.classList.toggle('sel',x===b));SFX.tap()});
  $('#ptReset').onclick=()=>{if(!guard(400))return;const b=$('#ptReset');if(b.dataset.c!=='1'){b.dataset.c='1';b.textContent='再按一次，確定歸零';speakSeq(['再按一次，點數和買到的寶物都會清掉。']);return}PT.d.pts=0;PT.d.own=[];PT.d.wear=null;ptSave();ptRefresh();b.textContent='已經歸零';speakSeq(['點數已經歸零。'])};
  $('#setOk').onclick=()=>{closeOv();renderHome()};showOv('ovSet');
}
function pauseGame(){if(CLK.paused)return;setPaused(true);
  $('#pauseBody').innerHTML=`<h2>⏸ 暫停中</h2><div class="row"><span>聲音</span><button class="btn vbtn"></button></div><div class="row"><span>說話速度</span></div>${speedSeg()}<button class="btn g big" id="pgOn">繼續玩</button>`;
  syncVoice();bindSpeed();$$('#pauseBody .vbtn').forEach(b=>b.onclick=toggleVoice);$('#pgOn').onclick=resumeGame;showOv('ovPause')}
function resumeGame(){closeOv();setPaused(false);RUN&&RUN.resume&&RUN.resume();qmResume()}
function askExit(){if(CLK.paused&&!SP.frz)return;spUnfreeze();setPaused(true);
  $('#exitBody').innerHTML=`<h2>要回首頁嗎？</h2><div class="sub" style="text-align:center">這一層還沒玩完喔。</div><button class="btn g big" id="exStay">繼續玩</button><button class="btn r" id="exGo">回首頁</button>`;
  $('#exStay').onclick=resumeGame;$('#exGo').onclick=()=>{closeOv();setPaused(false);RUNTOK++;clearLater();TTS.stop();QM.gen++;closeTeach();go('home')};showOv('ovExit')}

/* ================= 點數、角色、獎勵商店（和其他數學遊戲共用點數） ================= */
const PT={key:'math56-points-v2',d:{pts:0,ch:null,name:'',own:[],wear:null},round:0,combo:0,asked:false};
try{const s=_store&&_store.getItem(PT.key);if(s)Object.assign(PT.d,JSON.parse(s))}catch(e){}
function ptSave(){try{_store&&_store.setItem(PT.key,JSON.stringify(PT.d))}catch(e){}}
const PT_CHARS=[['🐶','小狗'],['🐱','小貓'],['🐰','小兔子'],['🐼','熊貓'],['🦊','狐狸'],['🐸','青蛙'],['🐯','小老虎'],['🐧','企鵝'],['🦄','獨角獸'],['🐲','小龍'],['🐵','小猴子'],['🐨','無尾熊']];
const PT_SHOP=[['🎈','氣球',30],['⭐','星星',30],['⚽','足球',40],['🍦','冰淇淋',40],['🎀','蝴蝶結',60],['🎩','魔術帽',60],['🕶️','墨鏡',80],['🧸','小熊',100],['🌈','彩虹',120],['🚲','腳踏車',150],['👑','皇冠',200],['🏆','大獎盃',300]];
const chE=()=>PT.d.ch||'🙂',chN=()=>{const c=PT_CHARS.find(x=>x[0]===PT.d.ch);return PT.d.name||(c?c[1]:'小朋友')},wearE=()=>PT.d.wear||'';
const avHTML=cls=>`<span class="av ${cls||''}"><span class="av-c">${chE()}</span>${wearE()?`<span class="av-w">${wearE()}</span>`:''}</span>`;
function ptRefresh(){const hc=$('#ptChip');if(hc)hc.innerHTML=`${avHTML()}<span class="pc-n">${esc(chN())}</span><span class="pc-p">⭐ ${PT.d.pts}</span>`;const lb=$('#avBox');if(lb)lb.innerHTML=`${avHTML()}<b>⭐${PT.d.pts}</b>`}
function ptAdd(n,why){if(!n)return;PT.d.pts+=n;PT.round+=n;ptSave();ptRefresh();const lb=$('#avBox');
  if(lb&&CURSCR==='level'){const av=lb.querySelector('.av');if(av){av.classList.remove('jump');void av.offsetWidth;av.classList.add('jump')}const f=document.createElement('span');f.className='ptfly';f.textContent=`+${n}`+(why?` ${why}`:'');lb.appendChild(f);setTimeout(()=>f.remove(),1300)}}
{const _qs=qmStart;qmStart=function(qs,cfg){const o=cfg.onAnswer;cfg.onAnswer=(first,q,rev)=>{o&&o(first,q,rev);if(RUN&&RUN.kind==='group')return;if(first){PT.combo++;ptAdd(10);if(PT.combo>=3&&PT.combo%3===0)later(()=>ptAdd(5,'連續答對'),500)}else{PT.combo=0;if(!rev)ptAdd(5)}};return _qs(qs,cfg)}}
{const _ls=levelScreen;levelScreen=function(){PT.round=0;PT.combo=0;const r=_ls();ptRefresh();return r}}
{const _ef=endFloor;endFloor=function(lv,res){ptAdd(20+calcStars(res)*10);return _ef(lv,res)}}
{const _eb=endBoss;endBoss=function(res){if(RUN&&RUN.hit>=Math.ceil(RUN.max*.6))ptAdd(100);return _eb(res)}}
{const _ed=endDaily;endDaily=function(first,ds){ptAdd(first?30:10);return _ed(first,ds)}}
{const _sr=showResult;showResult=function(o){if(PT.round>0&&RUN&&RUN.kind!=='group'){const n=PT.round;o=Object.assign({},o,{extra:(o.extra||'')+`<div class="ptgain">${avHTML('big')}<div><div class="pg-t">這一回得到</div><div class="pg-n">⭐ <span id="pgN">0</span> 點</div><div class="pg-s">一共有 ${PT.d.pts} 點</div></div></div>`,say:(o.say||'')+`這一回得到${n}點。`});
  later(()=>{const e=$('#pgN');if(!e)return;let v=0;const step=Math.max(1,Math.round(n/20)),t=setInterval(()=>{v=Math.min(n,v+step);e.textContent=v;SFX.tap();if(v>=n)clearInterval(t)},50)},500)}PT.round=0;return _sr(o)}}
{const _go=go;go=function(id){const r=_go(id);if(id==='home'){ptRefresh();if(!PT.d.ch&&!PT.asked){PT.asked=true;waitQuiet(()=>{if(CURSCR==='home'&&!document.querySelector('.ov.on'))openChar(true);else PT.asked=false})}}return r}}
function waitQuiet(cb){let quiet=0;const t0=Date.now();const busy=()=>{try{return S.voice&&TTS.ok&&(speechSynthesis.speaking||speechSynthesis.pending)}catch(e){return false}};
  const tick=()=>{if(CURSCR!=='home'){PT.asked=false;return}if(CLK.paused){setTimeout(tick,400);return}quiet=busy()?0:quiet+400;if(quiet>=1600&&Date.now()-t0>=(S.voice?2500:3000))return cb();if(Date.now()-t0>30000)return cb();setTimeout(tick,400)};setTimeout(tick,800)}
function ptOv(){let ov=$('#ovPt');if(!ov){ov=document.createElement('div');ov.className='ov';ov.id='ovPt';ov.innerHTML='<div class="panel ptpanel"></div>';$('#app').appendChild(ov)}return ov}
function openChar(first){const ov=ptOv(),p=ov.firstChild;
  p.innerHTML=`<h2>${first?'選一個你喜歡的角色':'我的角色'}</h2><div class="ptabs"><button class="btn sel" data-t="c">選角色</button><button class="btn" data-t="s">獎勵商店</button><button class="btn" data-t="b">我的寶物</button></div><div class="ptbody"></div><button class="btn g big" id="ptOk">好了</button>`;
  const body=p.querySelector('.ptbody');
  const tab=t=>{p.querySelectorAll('.ptabs .btn').forEach(b=>b.classList.toggle('sel',b.dataset.t===t));
    if(t==='c'){body.innerHTML=`<div class="chgrid">${PT_CHARS.map(c=>`<button class="chb ${PT.d.ch===c[0]?'sel':''}" data-c="${c[0]}"><span>${c[0]}</span><small>${c[1]}</small></button>`).join('')}</div><div class="row nmrow"><span>名字（可以不填）</span><input id="ptName" maxlength="6" value="${esc(PT.d.name)}" placeholder="打你的名字"></div>`;
      body.querySelectorAll('.chb').forEach(b=>b.onclick=()=>{PT.d.ch=b.dataset.c;ptSave();ptRefresh();body.querySelectorAll('.chb').forEach(x=>x.classList.toggle('sel',x===b));SFX.ok();const c=PT_CHARS.find(x=>x[0]===PT.d.ch);speakSeq([`你選了${c[1]}。`])});
      const ni=body.querySelector('#ptName');ni.oninput=()=>{PT.d.name=ni.value.trim().slice(0,6);ptSave();ptRefresh()}}
    else if(t==='s'){body.innerHTML=`<div class="ptnow">${avHTML('big')}<b>⭐ ${PT.d.pts} 點</b></div><div class="shopg">${PT_SHOP.map(s=>{const own=PT.d.own.includes(s[0]);return `<button class="shb ${own?'own':''}" data-e="${s[0]}"><span>${s[0]}</span><small>${s[1]}</small><em>${own?'已經有了':'⭐'+s[2]}</em></button>`}).join('')}</div>`;
      body.querySelectorAll('.shb').forEach(b=>b.onclick=()=>{if(!guard(300))return;const s=PT_SHOP.find(x=>x[0]===b.dataset.e);
        if(PT.d.own.includes(s[0])){PT.d.wear=s[0];ptSave();ptRefresh();SFX.swap();speakSeq([`${chN()}帶上了${s[1]}。`]);tab('s');return}
        if(PT.d.pts<s[2]){SFX.bad();speakSeq([`${s[1]}要${s[2]}點，還差${s[2]-PT.d.pts}點。多答對幾題就可以買了！`]);b.classList.remove('no');void b.offsetWidth;b.classList.add('no');return}
        PT.d.pts-=s[2];PT.d.own.push(s[0]);PT.d.wear=s[0];ptSave();ptRefresh();SFX.fanfare();confetti(24,[s[0],'✨','⭐']);speakSeq([`買到了${s[1]}！${chN()}帶上了${s[1]}。`]);tab('s')})}
    else{body.innerHTML=PT.d.own.length?`<div class="sub" style="text-align:center">點一下，讓角色帶上這個寶物</div><div class="shopg">${PT.d.own.map(e=>{const s=PT_SHOP.find(x=>x[0]===e)||[e,''];return `<button class="shb ${PT.d.wear===e?'sel':''}" data-e="${e}"><span>${e}</span><small>${s[1]}</small></button>`}).join('')}<button class="shb" data-e=""><span>🚫</span><small>不帶</small></button></div>`:`<div class="ptempty">還沒有寶物。<br>答對題目得到點數，就可以到「獎勵商店」買喔！</div>`;
      body.querySelectorAll('.shb').forEach(b=>b.onclick=()=>{PT.d.wear=b.dataset.e||null;ptSave();ptRefresh();SFX.tap();tab('b')})}};
  p.querySelectorAll('.ptabs .btn').forEach(b=>b.onclick=()=>{SFX.tap();tab(b.dataset.t);speakSeq([b.dataset.t==='c'?'選一個你喜歡的角色。':b.dataset.t==='s'?`你有${PT.d.pts}點。點一個寶物，就可以用點數買。`:'這些是你買到的寶物。'])});
  p.querySelector('#ptOk').onclick=()=>{if(!PT.d.ch){PT.d.ch=PT_CHARS[0][0];ptSave()}ptRefresh();TTS.stop();ov.classList.remove('on')};
  tab('c');ov.classList.add('on');speakSeq([first?'選一個你喜歡的角色。答對題目，可以得到點數，再到獎勵商店買寶物喔！':'選角色，或用點數買寶物。'])}

/* ---------- 初始化 ---------- */
function init(){
  initCover();
  $$('.vbtn').forEach(b=>b.onclick=e=>{e.stopPropagation();toggleVoice()});syncVoice();
  $('#dkClass').onclick=()=>{if(guard(350))openClass()};$('#dkGroup').onclick=()=>{if(guard(350))openGroupSetup()};
  $('#dkDaily').onclick=()=>{if(guard(350))startDaily()};$('#dkSet').onclick=()=>{if(guard(350))openSettings()};
  $('#lvHome').onclick=()=>{if(guard(300))askExit()};$('#lvPause').onclick=()=>{if(guard(300))pauseGame()};
  $('#lvListen').onclick=()=>{if(!guard(300)||CLK.paused)return;if(!qmSkip()&&QM.ctx&&CURSCR==='level'&&$('#qwrap .stem'))qmReplay()};
  $('#clsHome').onclick=()=>{TTS.stop();go('home')};
  $$('#clsTabs .btn').forEach((b,i)=>b.onclick=()=>{CLS.scene=i;TTS.stop();SFX.tap();renderClass()});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){if(CURSCR==='level'&&!CLK.paused&&!$('#ovTeach').classList.contains('on'))pauseGame();else TTS.stop()}});
  const sp=$('#home .bar .sp');if(sp)sp.insertAdjacentHTML('afterend','<button class="btn ptchip" id="ptChip"></button>');const chip=$('#ptChip');if(chip)chip.onclick=()=>{if(guard(350))openChar(false)};
  const row=$('#level .row2');if(row)row.insertAdjacentHTML('afterbegin','<div id="avBox"></div>');ptRefresh();
  window.__M65={S,go,startFloor,startBoss,startDaily,startGroup,GCFG,QM,LV,buildQs,buildBoss,CLK,RUN:()=>RUN,openClass,openSettings,tryMake,LESSON,CLS,renderClass};
  go('cover');
}
init();
